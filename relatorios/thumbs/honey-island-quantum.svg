<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Bitcoin e o risco da computação quântica">
  <defs>
    <linearGradient id="hiBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A3057"/>
      <stop offset="1" stop-color="#0A1628"/>
    </linearGradient>
    <radialGradient id="hiGlow" cx="0.34" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="320" height="180" fill="url(#hiBg)"/>
  <rect width="320" height="180" fill="url(#hiGlow)"/>

  <!-- lattice / qubit grid -->
  <g stroke="#93C5FD" stroke-opacity="0.28" stroke-width="1">
    <line x1="196" y1="34" x2="244" y2="58"/>
    <line x1="244" y1="58" x2="292" y2="40"/>
    <line x1="244" y1="58" x2="238" y2="112"/>
    <line x1="238" y1="112" x2="286" y2="132"/>
    <line x1="238" y1="112" x2="190" y2="140"/>
    <line x1="196" y1="34" x2="238" y2="112"/>
    <line x1="292" y1="40" x2="286" y2="132"/>
  </g>
  <g fill="#BFDBFE">
    <circle cx="196" cy="34" r="3.2" fill-opacity="0.9"/>
    <circle cx="244" cy="58" r="3.6"/>
    <circle cx="292" cy="40" r="3" fill-opacity="0.85"/>
    <circle cx="238" cy="112" r="3.6"/>
    <circle cx="286" cy="132" r="3" fill-opacity="0.85"/>
    <circle cx="190" cy="140" r="3.2" fill-opacity="0.9"/>
  </g>

  <!-- orbital rings (quantum) around the coin -->
  <g fill="none" stroke="#B8973A" stroke-opacity="0.55">
    <ellipse cx="104" cy="90" rx="70" ry="27" transform="rotate(-24 104 90)"/>
    <ellipse cx="104" cy="90" rx="70" ry="27" transform="rotate(38 104 90)" stroke-opacity="0.32"/>
  </g>

  <!-- bitcoin coin -->
  <circle cx="104" cy="90" r="40" fill="#0A1628" stroke="#B8973A" stroke-width="2.5"/>
  <circle cx="104" cy="90" r="40" fill="none" stroke="#93C5FD" stroke-opacity="0.15" stroke-width="6"/>
  <text x="104" y="91" text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'Playfair Display', serif" font-size="52" font-weight="700"
        fill="#E8C766">&#8383;</text>
</svg>
